{# Screen 2 of 5 — the conversational intake chat. #}
<section class="screen" id="screen-intake">
  <div class="card">
    <h2>A few questions</h2>
    <div id="progress-note"></div>
    <div id="chat-log"></div>
    <div id="wait-note"></div>
    <div class="row">
      <input type="text" id="chat-input" placeholder="Type your answer, or tap the mic to speak..." autocomplete="off">
      <button class="mic" id="btn-mic" title="Speak your answer" style="flex:0 0 auto;">&#127908;</button>
      <button class="primary" id="btn-send" style="flex:0 0 auto;">Send</button>
    </div>
    <div id="mic-status"></div>
  </div>
</section>

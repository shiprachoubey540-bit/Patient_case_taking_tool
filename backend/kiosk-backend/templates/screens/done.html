{# Screen 5 of 5 — shows the 6-char visit code (see README's "Persistence &
   the doctor view" section for what it is and isn't). #}
<section class="screen" id="screen-done">
  <div class="card" style="text-align:center;">
    <h2 id="done-heading">Thank you</h2>
    <p class="lead">Please take a seat — you'll be called shortly.</p>
    <p style="font-size:13px; color:var(--muted); margin-bottom:4px;">Your visit code — show this at the desk:</p>
    <div id="visit-ref" style="font-size:28px; font-weight:700; letter-spacing:3px; font-family:monospace; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px; display:inline-block; min-width:180px;"></div>
    <button class="secondary big" id="btn-new-visit" style="margin-top:16px;">Start next patient</button>
  </div>
</section>
